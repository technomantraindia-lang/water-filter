<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Category | Water Filter Africa</title>
  <meta name="description" content="Browse Water Filter Africa products by water-treatment category." />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    :root{--deep:#031D31;--navy:#052A45;--navy2:#063B5D;--ink:#061E38;--blue:#0789F9;--cyan:#4DD8F5;--pale:#F7FBFE;--muted:#5D7287;--line:rgba(6,46,82,.12);--shadow:0 26px 70px rgba(3,29,49,.12)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--pale);overflow-x:hidden}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}:focus-visible{outline:3px solid rgba(77,216,245,.85);outline-offset:4px}.container{width:min(1180px,calc(100% - 40px));margin:0 auto}.section{padding:74px 0}.cat-hero{color:#fff;background:radial-gradient(circle at 78% 24%,rgba(77,216,245,.24),transparent 28%),linear-gradient(145deg,var(--deep),var(--navy));padding:78px 0 64px;overflow:hidden}.breadcrumb{display:flex;flex-wrap:wrap;gap:9px;color:rgba(237,247,252,.76);font-size:.9rem;margin-bottom:34px}.breadcrumb a:hover{color:var(--cyan)}.eyebrow{display:inline-flex;gap:10px;align-items:center;color:var(--cyan);font-size:.76rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.eyebrow::before{content:"";width:34px;height:1px;background:currentColor}h1,h2,h3,p{margin-top:0}h1{margin:14px 0 18px;max-width:850px;font-size:clamp(2.5rem,4.5vw,4.4rem);line-height:1.02;letter-spacing:-.045em}.cat-desc{max-width:760px;color:rgba(237,247,252,.78);line-height:1.75;font-size:1.08rem}
    .switcher{display:flex;flex-wrap:wrap;gap:10px;margin:34px 0 42px}.switcher a{padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);font-weight:800;font-size:.84rem;transition:transform .32s ease,border-color .32s ease,background .32s ease,color .32s ease}.switcher a:hover,.switcher a.active{transform:translateY(-2px);border-color:rgba(77,216,245,.42);background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}
    .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.product-card{position:relative;display:flex;flex-direction:column;min-height:100%;padding:22px;border:1px solid rgba(6,46,82,.1);border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(3,29,49,.08);overflow:hidden;transition:transform .42s ease,border-color .42s ease,box-shadow .42s ease}.product-card::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan));transform:scaleX(0);transform-origin:left;transition:transform .42s ease}.product-stage{position:relative;display:grid;place-items:center;min-height:230px;margin-bottom:20px;border-radius:14px;background:radial-gradient(circle at 50% 50%,rgba(77,216,245,.22),transparent 48%),linear-gradient(145deg,#fafdff,#edf7fc);overflow:hidden}.product-stage::before{content:"";position:absolute;inset:18px;border:1px solid rgba(7,137,249,.12);background-image:linear-gradient(90deg,rgba(7,137,249,.08) 1px,transparent 1px);background-size:44px 100%;pointer-events:none}.product-stage img{position:relative;z-index:1;max-width:86%;max-height:190px;object-fit:contain;filter:drop-shadow(0 24px 24px rgba(3,29,49,.18));transition:transform .45s ease}.product-label{color:var(--blue);font-size:.74rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.product-card h2{margin:12px 0 12px;font-size:1.28rem;line-height:1.16;letter-spacing:-.025em}.product-card p{color:var(--muted);line-height:1.62;flex:1}.product-cta{margin-top:18px;color:var(--navy);font-weight:900}.product-cta span{display:inline-block;transition:transform .36s ease}.product-card:hover{transform:translateY(-4px);border-color:rgba(7,137,249,.32);box-shadow:0 24px 60px rgba(3,29,49,.11)}.product-card:hover::after{transform:scaleX(1)}.product-card:hover .product-stage img{transform:translateY(-6px) scale(1.025)}.product-card:hover .product-cta span{transform:translateX(7px)}
    .empty{padding:42px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--muted);line-height:1.7}.empty a{display:inline-flex;margin-top:18px;color:var(--blue);font-weight:900}.reveal{visibility:hidden}@media(max-width:980px){.product-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.container{width:min(100% - 28px,620px)}.cat-hero{padding:58px 0 50px}.product-grid{grid-template-columns:1fr}.product-stage{min-height:210px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}.reveal{visibility:visible;opacity:1!important;transform:none!important;filter:none!important}}
  </style>
  <link rel="stylesheet" href="components/layout.css" />
</head>
<body>
  <div data-layout-header></div>
  <main>
    <header class="cat-hero">
      <div class="container">
        <nav class="breadcrumb reveal" aria-label="Breadcrumb"><a href="index.html#home">Home</a><span>/</span><a href="product.html">Products</a><span>/</span><span id="crumbCategory"></span></nav>
        <span class="eyebrow reveal" id="categoryEyebrow">Product Category</span>
        <h1 class="reveal" id="categoryTitle"></h1>
        <p class="cat-desc reveal" id="categoryDesc"></p>
      </div>
    </header>
    <section class="section">
      <div class="container">
        <nav class="switcher reveal" id="switcher" aria-label="Product categories"></nav>
        <div class="product-grid" id="productGrid"></div>
        <div class="empty" id="emptyState" hidden>No products are currently available in this category.<br><a href="product.html">Back to Products →</a></div>
      </div>
    </section>
  </main>
  <div data-layout-footer></div>
  <script src="components/layout.js"></script>
  <script src="components/products-data.js"></script>
  <script>
    const data=window.WFA_PRODUCTS;
    const params=new URLSearchParams(location.search);
    const initialSlug=params.get("slug")||data.categories[0].slug;
    const els={title:document.getElementById("categoryTitle"),desc:document.getElementById("categoryDesc"),crumb:document.getElementById("crumbCategory"),eyebrow:document.getElementById("categoryEyebrow"),switcher:document.getElementById("switcher"),grid:document.getElementById("productGrid"),empty:document.getElementById("emptyState")};
    function categoryBySlug(slug){return data.categories.find(c=>c.slug===slug)||data.categories[0];}
    function productCard(product){return `<a class="product-card reveal" href="${product.productUrl}"><div class="product-stage"><img src="${product.image}" alt="${product.name}"></div><span class="product-label">${product.technology}</span><h2>${product.name}</h2><p>${product.shortDescription}</p><span class="product-cta">View Product <span>→</span></span></a>`;}
    function render(slug, animate=true){
      const category=categoryBySlug(slug);
      document.title=`${category.name} | Water Filter Africa`;
      els.title.textContent=category.name;els.desc.textContent=category.description;els.crumb.textContent=category.name;els.eyebrow.textContent=`Product Category / ${category.number}`;
      els.switcher.innerHTML=`<a href="product.html">All Categories</a>`+data.categories.map(c=>`<a class="${c.id===category.id?"active":""}" href="category.html?slug=${c.slug}" data-slug="${c.slug}">${c.label}</a>`).join("");
      const products=data.products.filter(p=>p.category===category.id);
      const update=()=>{els.grid.innerHTML=products.map(productCard).join("");els.empty.hidden=products.length!==0;animateProducts();};
      if(animate&&window.gsap){gsap.to(".product-card",{autoAlpha:0,y:10,duration:.22,ease:"power2.out",onComplete:update});}else update();
      history.replaceState(null,"",`category.html?slug=${category.slug}`);
    }
    function animateProducts(){if(window.gsap&&!matchMedia("(prefers-reduced-motion: reduce)").matches){gsap.set(".product-card",{autoAlpha:0,y:20});gsap.to(".product-card",{autoAlpha:1,y:0,duration:.5,stagger:.08,ease:"power3.out"});}else document.querySelectorAll(".reveal").forEach(el=>{el.style.visibility="visible";el.style.opacity="1";el.style.transform="none";});}
    els.switcher.addEventListener("click",e=>{const link=e.target.closest("a[data-slug]");if(!link)return;e.preventDefault();render(link.dataset.slug);});
    document.addEventListener("DOMContentLoaded",()=>{render(initialSlug,false);if(window.gsap&&!matchMedia("(prefers-reduced-motion: reduce)").matches){gsap.set(".reveal",{autoAlpha:0,y:24,filter:"blur(6px)"});gsap.to(".cat-hero .reveal",{autoAlpha:1,y:0,filter:"blur(0)",duration:.75,stagger:.08,ease:"power3.out"});gsap.to(".switcher.reveal",{autoAlpha:1,y:0,filter:"blur(0)",duration:.65,delay:.25,ease:"power3.out"});animateProducts();}else{document.querySelectorAll(".reveal").forEach(el=>{el.style.visibility="visible";el.style.opacity="1";el.style.transform="none";el.style.filter="none";});}});
  </script>
</body>
</html>
