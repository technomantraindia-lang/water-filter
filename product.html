<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | Water Filter Africa</title>
  <meta name="description" content="Explore Water Filter Africa product categories for industrial, agricultural, animal farming, commercial and domestic water filtration applications." />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    :root{--deep:#031D31;--navy:#052A45;--navy2:#063B5D;--ink:#061E38;--blue:#0789F9;--cyan:#4DD8F5;--pale:#F7FBFE;--muted:#5D7287;--line:rgba(6,46,82,.12);--shadow:0 30px 80px rgba(3,29,49,.14)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--pale);overflow-x:hidden}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}:focus-visible{outline:3px solid rgba(77,216,245,.85);outline-offset:4px}.container{width:min(1180px,calc(100% - 40px));margin:0 auto}
    .hero-banner{background:var(--deep);overflow:hidden}.hero-banner img{width:100%;height:clamp(320px,52vw,690px);object-fit:cover;object-position:center}
    .section{position:relative;padding:92px 0;overflow:hidden}.section::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 18%,rgba(77,216,245,.18),transparent 28%),linear-gradient(rgba(7,137,249,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(7,137,249,.035) 1px,transparent 1px);background-size:auto,48px 48px,48px 48px;pointer-events:none}.section .container{position:relative;z-index:1}.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--blue);font-size:.76rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.eyebrow::before{content:"";width:34px;height:1px;background:currentColor}h1,h2,h3,p{margin-top:0}h1{margin:0;color:#fff;font-size:clamp(3.5rem,6vw,5.75rem)}h2{margin:14px 0 20px;max-width:760px;font-size:clamp(2rem,3vw,2.875rem);line-height:1.08;letter-spacing:-.035em}.lead{max-width:760px;color:var(--muted);line-height:1.75;font-size:1.08rem}
    .category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:40px}.category-card{position:relative;display:flex;flex-direction:column;min-height:390px;border:1px solid rgba(35,186,240,.13);border-radius:18px;overflow:hidden;color:#fff;background:#062B47;box-shadow:0 18px 42px rgba(4,30,48,.11);isolation:isolate;transition:transform .6s cubic-bezier(.22,1,.36,1),border-color .6s ease,box-shadow .6s ease}.category-card::before,.category-card::after{content:"";position:absolute;z-index:4;width:24px;height:24px;pointer-events:none;opacity:.75;transition:opacity .5s ease,transform .5s ease}.category-card::before{left:13px;top:13px;border-left:1px solid rgba(72,212,255,.5);border-top:1px solid rgba(72,212,255,.5)}.category-card::after{right:13px;bottom:13px;border-right:1px solid rgba(72,212,255,.42);border-bottom:1px solid rgba(72,212,255,.42)}.category-image{height:168px;overflow:hidden;border-radius:17px 17px 0 0;background:#073553}.category-image img{width:100%;height:100%;object-fit:cover;transition:transform .65s cubic-bezier(.22,1,.36,1)}.category-content{position:relative;display:flex;flex:1;flex-direction:column;padding:20px;background:linear-gradient(145deg,#061F35 0%,#073553 100%);transition:background .6s ease}.category-meta{display:flex;align-items:center;gap:10px;margin-bottom:15px}.category-icon{width:38px;height:38px;display:grid;place-items:center;flex:0 0 auto;color:#38CEF5;background:rgba(35,186,240,.10);border:1px solid rgba(35,186,240,.20);border-radius:10px;transition:transform .5s ease,box-shadow .5s ease,background .5s ease}.category-icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.category-num{color:#48D4FF;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.category-content h3{margin:0 0 10px;color:#fff;font-size:clamp(1.05rem,1.2vw,1.25rem);line-height:1.14;font-weight:800;transition:transform .5s ease,color .5s ease}.category-content p{margin:0 0 16px;color:rgba(255,255,255,.72);font-size:.84rem;line-height:1.5}.category-cta{position:relative;display:inline-flex;align-items:center;gap:8px;width:max-content;margin-top:auto;color:#fff;font-size:.84rem;font-weight:700}.category-cta::after{content:"";position:absolute;left:0;bottom:-5px;width:34px;height:2px;background:#20BDF2;transform-origin:left;transition:width .5s ease}.category-cta span{display:inline-block;transition:transform .45s ease}.category-card:hover{transform:translateY(-7px);border-color:rgba(35,186,240,.35);box-shadow:0 24px 58px rgba(4,30,48,.16)}.category-card:hover .category-image img{transform:scale(1.045)}.category-card:hover .category-content{background:linear-gradient(145deg,#072942 0%,#084061 100%)}.category-card:hover .category-icon{transform:translateY(-2px);background:rgba(35,186,240,.16);box-shadow:0 0 24px rgba(56,206,245,.2)}.category-card:hover .category-content h3{transform:translateY(-3px);color:#fff}.category-card:hover .category-cta{color:#4AD8FF}.category-card:hover .category-cta::after{width:100%}.category-card:hover .category-cta span{transform:translateX(5px)}
    .reveal,.clip-reveal{visibility:hidden}@media(max-width:1220px){.container{width:min(1080px,calc(100% - 36px))}.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.category-card{min-height:390px}.section{padding:78px 0}.hero-banner img{height:clamp(300px,46vw,430px)}}@media(max-width:580px){.container{width:min(100% - 28px,580px)}.section{padding:62px 0}.hero-banner img{height:240px}h2{font-size:clamp(1.75rem,8vw,2.05rem)}.lead{font-size:1rem}.category-grid{grid-template-columns:1fr;gap:16px;margin-top:30px}.category-card{min-height:auto;border-radius:16px}.category-image{height:188px;border-radius:15px 15px 0 0}.category-content{padding:20px}.category-content h3{font-size:1.22rem}.category-content p{font-size:.92rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}.reveal,.clip-reveal{visibility:visible;opacity:1!important;transform:none!important;clip-path:none!important;filter:none!important}}
  </style>
  <link rel="stylesheet" href="components/layout.css" />
</head>
<body>
  <div data-layout-header></div>
  <main>
    <section class="hero-banner clip-reveal" aria-label="Products banner"><img src="images/product banner .png" alt="Water Filter Africa products banner" /></section>
    <section class="section">
      <div class="container">
        <span class="eyebrow reveal">Our Product Range</span>
        <h2 class="reveal">Explore Water Solutions by Application</h2>
        <p class="lead reveal">Browse our water-treatment technologies by category to find solutions suited to industrial, agricultural, commercial, livestock and domestic applications.</p>
        <div class="category-grid" id="categoryGrid"></div>
      </div>
    </section>
  </main>
  <div data-layout-footer></div>
  <script src="components/layout.js"></script>
  <script src="components/products-data.js"></script>
  <script>
    const grid=document.getElementById("categoryGrid");
    const icons={
      industrial:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V9l5 3V9l5 3V7h4v14M8 17h1M12 17h1M16 17h1"/></svg>',
      agriculture:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20c8-1 13-6 14-15-8 1-13 6-14 15ZM5 20c2-5 6-8 11-10M4 14H2m20 0h-2M12 22v-2"/></svg>',
      "animal-farming":'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12c2-4 6-6 10-4 3 1 5 4 5 8v3M7 13h.01M10 19v-3M16 19v-3M18 11l3-2M6 9 4 6"/></svg>',
      commercial:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5h10v16M14 9h6v12M8 9h2M8 13h2M8 17h2M17 13h1M17 17h1"/></svg>',
      domestic:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7M5 10v11h14V10M9 21v-6h6v6M12 9c2 2 3 4 3 6a3 3 0 0 1-6 0c0-2 1-4 3-6Z"/></svg>'
    };
    window.WFA_PRODUCTS.categories.forEach(category=>{
      const card=document.createElement("a");
      card.className="category-card reveal";
      card.href=`category.html?slug=${category.slug}`;
      card.innerHTML=`<div class="category-image"><img src="${category.image}" alt="${category.name}"></div><div class="category-content"><div class="category-meta"><span class="category-icon">${icons[category.id]}</span><span class="category-num">${category.number} / ${category.label}</span></div><h3>${category.name}</h3><p>${category.description}</p><span class="category-cta">Explore Category <span>&rarr;</span></span></div>`;
      grid.appendChild(card);
    });
    document.addEventListener("DOMContentLoaded",()=>{const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;if(window.gsap&&!reduced){gsap.set(".reveal",{autoAlpha:0,y:35,scale:.97,filter:"blur(6px)"});gsap.set(".clip-reveal",{autoAlpha:0,scale:1.03});gsap.to(".clip-reveal",{autoAlpha:1,scale:1,duration:1,ease:"power4.out"});gsap.to(".eyebrow.reveal,h2.reveal,.lead.reveal",{autoAlpha:1,y:0,scale:1,filter:"blur(0)",duration:.75,stagger:.08,ease:"power3.out"});gsap.to(".category-card",{autoAlpha:1,y:0,scale:1,filter:"blur(0)",duration:.82,stagger:.1,delay:.22,ease:"power3.out"});}else{document.querySelectorAll(".reveal,.clip-reveal").forEach(el=>{el.style.visibility="visible";el.style.opacity="1";el.style.transform="none";el.style.filter="none";});}});
  </script>
</body>
</html>
